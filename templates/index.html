<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <!-- Bootstrap CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.4.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100">
  <!-- Footer -->
<footer style="background: #111; border-top: 1px solid #333;" class="mt-5 py-4 text-center">
  <div class="container">
    <p class="text-secondary mb-1" style="font-size: 0.9rem;">
      &copy; {{ current_year }} Todos los derechos reservados.
    </p>
    <p class="text-secondary mb-0" style="font-size: 0.85rem;">
      Desarrollado por <span class="text-white fw-semibold">Ariel Castro</span>
    </p>
  </div>
</footer>
  <form action="{{ url_for('main.login') }}" method="post" class="p-4 border rounded">
    <h2 class="mb-3">Acceso</h2>
    <div class="mb-3">
      <label for="user" class="form-label">Usuario</label>
      <input type="text" name="user" id="user" class="form-control">
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Contraseña</label>
      <input type="password" name="password" id="password" class="form-control">
    </div>
    <button type="submit" class="btn btn-primary w-100">Entrar</button>
    {% if error %}
      <p class="text-danger mt-2">{{ error }}</p>
    {% endif %}
  </form>
</body>
</html>
