<!-- turno/app/templates/login.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TurnoApp — Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      /* ── Imagen de fondo ── */
      background-image: url('/static/img/login_bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Overlay oscuro semitransparente sobre la imagen */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(15, 23, 42, 0.75) 0%,
        rgba(37, 99, 235, 0.45) 100%
      );
      z-index: 0;
    }

    /* ── Card de login ── */
    .login-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 16px;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 44px 40px;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255,255,255,0.2);
    }

    /* Logo / marca */
    .login-brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-brand .brand-icon {
      width: 64px; height: 64px;
      background: rgba(37, 99, 235, 0.85);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 14px;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.5);
    }

    .login-brand .brand-icon i {
      font-size: 1.8rem;
      color: #ffffff;
    }

    .login-brand h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 4px;
    }

    .login-brand p {
      font-size: 0.875rem;
      color: rgba(255,255,255,0.65);
      margin: 0;
    }

    /* Campos */
    .field-group {
      margin-bottom: 18px;
    }

    .field-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
      margin-bottom: 7px;
      letter-spacing: 0.03em;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.5);
      font-size: 1rem;
      pointer-events: none;
    }

    .input-wrap input {
      width: 100%;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      padding: 12px 14px 12px 42px;
      color: #ffffff;
      font-size: 0.9rem;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .input-wrap input::placeholder {
      color: rgba(255,255,255,0.35);
    }

    .input-wrap input:focus {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.55);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.35);
    }

    /* Botón */
    .btn-login {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 8px;
      box-shadow: 0 4px 14px rgba(37,99,235,0.5);
    }

    .btn-login:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(37,99,235,0.6);
    }

    .btn-login:active { transform: translateY(0); }

    /* Error */
    .error-box {
      background: rgba(220, 38, 38, 0.2);
      border: 1px solid rgba(220, 38, 38, 0.45);
      border-radius: 10px;
      padding: 11px 14px;
      margin-bottom: 20px;
      display: flex; align-items: center; gap: 8px;
      font-size: 0.85rem;
      color: #fca5a5;
    }

    .error-box i { font-size: 1rem; flex-shrink: 0; }

    /* Footer */
    .login-footer {
      text-align: center;
      margin-top: 28px;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.4);
    }

    /* Partículas decorativas */
    .deco-circle {
      position: fixed;
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
    }

    .deco-circle-1 {
      width: 300px; height: 300px;
      top: -80px; right: -80px;
      background: rgba(37,99,235,0.15);
    }

    .deco-circle-2 {
      width: 200px; height: 200px;
      bottom: -60px; left: -60px;
      background: rgba(37,99,235,0.1);
    }

    @media (max-width: 480px) {
      .login-card { padding: 32px 24px; }
    }
  </style>
</head>
<body>

  <!-- Círculos decorativos -->
  <div class="deco-circle deco-circle-1"></div>
  <div class="deco-circle deco-circle-2"></div>

  <div class="login-wrapper">
    <div class="login-card">

      <!-- Marca -->
      <div class="login-brand">
        <div class="brand-icon">
          <i class="bi bi-clock-history"></i>
        </div>
        <h1>TurnoApp</h1>
        <p>Control de asistencia y turnos</p>
      </div>

      <!-- Error -->
      {% if error %}
        <div class="error-box">
          <i class="bi bi-exclamation-circle-fill"></i>
          {{ error }}
        </div>
      {% endif %}

      <!-- Formulario -->
      <form method="post">

        <div class="field-group">
          <label for="user">Usuario</label>
          <div class="input-wrap">
            <i class="bi bi-person"></i>
            <input
              type="text"
              id="user"
              name="user"
              placeholder="Tu nombre de usuario"
              autocomplete="username"
              required
            >
          </div>
        </div>

        <div class="field-group">
          <label for="password">Contraseña</label>
          <div class="input-wrap">
            <i class="bi bi-lock"></i>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            >
          </div>
        </div>

        <button type="submit" class="btn-login">
          <i class="bi bi-box-arrow-in-right"></i>
          Iniciar Sesión
        </button>

      </form>

      <div class="login-footer">
        &copy; {{ current_year }} TurnoApp — Desarrollado por Ariel Castro
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
