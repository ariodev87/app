<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TurnoApp — Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-family: "Inter", sans-serif; }

    html { height: 100%; }

    body {
      height: 100%;
      min-height: 100vh;
      background-image: url("/static/img/login_bg.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, rgba(15,23,42,0.75) 0%, rgba(37,99,235,0.45) 100%);
      z-index: 0;
    }

    /* ── Contenedor lluvia/nieve ── */
    #lluvia {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }

    @keyframes caerGota {
      0%   { transform: translateY(-20px) skewX(-8deg); opacity: 1; }
      100% { transform: translateY(110vh)  skewX(-8deg); opacity: 0.2; }
    }

    .gota {
      position: absolute;
      top: 0;
      width: 1.5px;
      border-radius: 2px;
      background: linear-gradient(to bottom, transparent, rgba(180,220,255,0.55));
      animation: caerGota linear infinite;
    }

    @keyframes flashTormenta {
      0%, 90%, 100% { opacity: 0; }
      92%, 96%      { opacity: 0.08; }
    }

    #flashOverlay {
      position: fixed;
      inset: 0;
      z-index: 3;
      background: #fff;
      pointer-events: none;
      opacity: 0;
      display: none;
    }

    #flashOverlay.activo {
      display: block;
      animation: flashTormenta 4s ease infinite;
    }

    @keyframes caerNieve {
      0%   { transform: translateY(-10px) translateX(0); opacity: 0.9; }
      50%  { transform: translateY(50vh) translateX(12px); }
      100% { transform: translateY(110vh) translateX(-8px); opacity: 0.2; }
    }

    .copo {
      position: absolute;
      top: 0;
      border-radius: 50%;
      background: rgba(220,240,255,0.75);
      animation: caerNieve linear infinite;
    }

    /* ── Animaciones entrada ── */
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ── Widget tiempo ── */
    .weather-widget {
      position: fixed;
      top: 22px;
      right: 22px;
      z-index: 10;
      width: 280px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.10);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.20);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      color: #fff;
      animation: fadeIn 0.6s ease 0.4s both;
    }

    .weather-icon-box {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: rgba(255,255,255,0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1.75rem;
      color: #fff;
    }

    .weather-data .label {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .weather-data .temp  { font-size: 1.8rem; font-weight: 800; line-height: 1; color: #fff; }
    .weather-data .desc  { font-size: 0.85rem; color: rgba(255,255,255,0.88); margin-top: 2px; }
    .weather-data .meta  { font-size: 0.72rem; color: rgba(255,255,255,0.55); margin-top: 3px; }

    /* ── Reloj ── */
    .clock-widget {
      position: fixed;
      top: 22px;
      left: 22px;
      z-index: 10;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.10);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.20);
      padding: 14px 20px;
      color: #fff;
      text-align: center;
      min-width: 160px;
      animation: fadeIn 0.6s ease 0.4s both;
    }

    .clock-time { font-size: 2rem; font-weight: 800; line-height: 1; letter-spacing: 0.04em; color: #fff; }
    .clock-seconds { font-size: 1.1rem; font-weight: 400; color: rgba(255,255,255,0.55); }
    .clock-date { font-size: 0.75rem; color: rgba(255,255,255,0.60); margin-top: 5px; letter-spacing: 0.03em; text-transform: capitalize; }

    /* ── Login ── */
    .login-box {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 420px;
      padding: 0 16px;
      animation: fadeSlideUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .login-card {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 20px;
      padding: 44px 40px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.20);
    }

    .login-brand { text-align: center; margin-bottom: 32px; }

    .brand-icon {
      width: 64px; height: 64px;
      background: rgba(37,99,235,0.85);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 14px;
      box-shadow: 0 4px 16px rgba(37,99,235,0.50);
    }

    .brand-icon i { font-size: 1.8rem; color: #fff; }
    .login-brand h1 { font-size: 1.5rem; font-weight: 700; color: #fff; margin: 0 0 4px; }
    .login-brand p  { font-size: 0.875rem; color: rgba(255,255,255,0.65); }

    .field-group { margin-bottom: 18px; }

    .field-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
      margin-bottom: 7px;
      letter-spacing: 0.03em;
    }

    .input-wrap { position: relative; }

    .input-wrap .bi {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.50);
      font-size: 1rem;
      pointer-events: none;
    }

    .input-wrap input {
      width: 100%;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.20);
      border-radius: 10px;
      padding: 12px 14px 12px 42px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }

    .input-wrap input::placeholder { color: rgba(255,255,255,0.35); }

    .input-wrap input:focus {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.55);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.35);
    }

    .btn-login {
      width: 100%;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 8px;
      box-shadow: 0 4px 14px rgba(37,99,235,0.50);
      transition: background 0.15s, transform 0.10s, box-shadow 0.15s;
      position: relative;
      overflow: hidden;
    }

    .btn-login::after {
      content: "";
      position: absolute;
      top: 0; left: -100%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
      transform: skewX(-20deg);
      transition: left 0.5s ease;
    }

    .btn-login:hover::after { left: 160%; }
    .btn-login:hover { background: #1d4ed8; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37,99,235,0.60); }
    .btn-login:active { transform: translateY(0); }

    .error-box {
      background: rgba(220,38,38,0.20);
      border: 1px solid rgba(220,38,38,0.45);
      border-radius: 10px;
      padding: 11px 14px;
      margin-bottom: 20px;
      display: flex; align-items: center; gap: 8px;
      font-size: 0.85rem;
      color: #fca5a5;
    }

    .login-footer { text-align: center; margin-top: 28px; font-size: 0.78rem; color: rgba(255,255,255,0.40); }

    .deco { position: fixed; border-radius: 50%; pointer-events: none; z-index: 1; }
    .deco-1 { width: 300px; height: 300px; top: -80px; right: -80px; background: rgba(37,99,235,0.15); }
    .deco-2 { width: 200px; height: 200px; bottom: -60px; left: -60px; background: rgba(37,99,235,0.10); }

    @media (max-width: 600px) {
      .weather-widget { top: auto; bottom: 16px; right: 12px; left: 12px; width: auto; }
      .clock-widget   { top: 12px; left: 50%; transform: translateX(-50%); min-width: 140px; }
      .login-card     { padding: 32px 22px; }
    }
  </style>
</head>
<body>

  <div class="deco deco-1"></div>
  <div class="deco deco-2"></div>

  <div id="lluvia"></div>
  <div id="flashOverlay"></div>

  <!-- Reloj -->
  <div class="clock-widget">
    <div class="clock-time">
      <span id="clockH">--</span>:<span id="clockM">--</span><span class="clock-seconds">:<span id="clockS">--</span></span>
    </div>
    <div id="clockDate" class="clock-date">cargando...</div>
  </div>

  <!-- Tiempo -->
  <div class="weather-widget">
    <div class="weather-icon-box">
      <i id="wIcon" class="bi bi-cloud-sun-fill"></i>
    </div>
    <div class="weather-data">
      <div class="label">Madrid &mdash; Tiempo actual</div>
      <div id="wTemp" class="temp">--&deg;</div>
      <div id="wDesc" class="desc">Cargando...</div>
      <div id="wMeta" class="meta">Actualizando datos</div>
    </div>
  </div>

  <!-- Login -->
  <div class="login-box">
    <div class="login-card">

      <div class="login-brand">
        <div class="brand-icon">
          <i class="bi bi-clock-history"></i>
        </div>
        <h1>TurnoApp</h1>
        <p>Control de asistencia y turnos</p>
      </div>

      {% if error %}
        <div class="error-box">
          <i class="bi bi-exclamation-circle-fill"></i>
          {{ error }}
        </div>
      {% endif %}

      <form method="post">
        <div class="field-group">
          <label for="user">Usuario</label>
          <div class="input-wrap">
            <i class="bi bi-person"></i>
            <input type="text" id="user" name="user"
                   placeholder="Tu nombre de usuario"
                   autocomplete="username" required>
          </div>
        </div>

        <div class="field-group">
          <label for="password">Contraseña</label>
          <div class="input-wrap">
            <i class="bi bi-lock"></i>
            <input type="password" id="password" name="password"
                   placeholder="••••••••"
                   autocomplete="current-password" required>
          </div>
        </div>

        <button type="submit" class="btn-login">
          <i class="bi bi-box-arrow-in-right"></i>
          Iniciar Sesión
        </button>
      </form>

      <div class="login-footer">
        &copy; {{ current_year }} TurnoApp &mdash; Desarrollado por <strong>Ariel Castro</strong>
      </div>

    </div>
  </div>

  <script>
    /* ── RELOJ ── */
    const DIAS    = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
    const MESES_R = ["enero","febrero","marzo","abril","mayo","junio","julio",
                     "agosto","septiembre","octubre","noviembre","diciembre"];

    function pad(n) { return String(n).padStart(2,"0"); }

    function actualizarReloj() {
      const now = new Date();
      document.getElementById("clockH").textContent = pad(now.getHours());
      document.getElementById("clockM").textContent = pad(now.getMinutes());
      document.getElementById("clockS").textContent = pad(now.getSeconds());
      document.getElementById("clockDate").textContent =
        DIAS[now.getDay()] + ", " + now.getDate() + " de " +
        MESES_R[now.getMonth()] + " " + now.getFullYear();
    }
    actualizarReloj();
    setInterval(actualizarReloj, 1000);

    /* ── EFECTOS CLIMÁTICOS ── */
    const contenedorLluvia = document.getElementById("lluvia");
    const flashEl          = document.getElementById("flashOverlay");

    function limpiarEfectos() {
      contenedorLluvia.innerHTML = "";
      flashEl.classList.remove("activo");
    }

    function crearLluvia(cantidad, intensa) {
      limpiarEfectos();
      for (let i = 0; i < cantidad; i++) {
        const g = document.createElement("div");
        g.classList.add("gota");
        g.style.left              = Math.random() * 100 + "vw";
        g.style.animationDuration = (0.3 + Math.random() * 0.6) + "s";
        g.style.animationDelay    = (Math.random() * 2) + "s";
        g.style.height            = (intensa ? 20 + Math.random() * 16 : 10 + Math.random() * 12) + "px";
        g.style.opacity           = intensa ? (0.5 + Math.random() * 0.4) : (0.2 + Math.random() * 0.3);
        contenedorLluvia.appendChild(g);
      }
    }

    function crearNieve(cantidad) {
      limpiarEfectos();
      for (let i = 0; i < cantidad; i++) {
        const c = document.createElement("div");
        c.classList.add("copo");
        const s = 3 + Math.random() * 5;
        c.style.width             = s + "px";
        c.style.height            = s + "px";
        c.style.left              = Math.random() * 100 + "vw";
        c.style.animationDuration = (4 + Math.random() * 6) + "s";
        c.style.animationDelay    = (Math.random() * 5) + "s";
        c.style.opacity           = 0.4 + Math.random() * 0.5;
        contenedorLluvia.appendChild(c);
      }
    }

    function activarEfecto(code) {
      if      (code === 95)                            { crearLluvia(150, true);  flashEl.classList.add("activo"); }
      else if ([55, 63, 65, 81, 82].includes(code))   { crearLluvia(120, true); }
      else if ([61, 80].includes(code))                { crearLluvia(70, false); }
      else if ([51, 53].includes(code))                { crearLluvia(40, false); }
      else if ([71, 73, 75].includes(code))            { crearNieve(80); }
      else                                             { limpiarEfectos(); }
    }

    /* ── WIDGET TIEMPO ── */
    const WEATHER_CODES = {
      0:"Despejado", 1:"Poco nuboso", 2:"Parcialmente nuboso", 3:"Cubierto",
      45:"Niebla", 48:"Niebla helada",
      51:"Llovizna ligera", 53:"Llovizna", 55:"Llovizna intensa",
      61:"Lluvia ligera", 63:"Lluvia", 65:"Lluvia fuerte",
      71:"Nieve ligera", 73:"Nieve", 75:"Nieve fuerte",
      80:"Chubascos ligeros", 81:"Chubascos", 82:"Chubascos fuertes",
      95:"Tormenta"
    };

    const WEATHER_ICONS = {
      0:"bi-brightness-high-fill",
      1:"bi-cloud-sun-fill", 2:"bi-cloud-sun-fill",
      3:"bi-cloud-fill",
      45:"bi-cloud-fog2-fill", 48:"bi-cloud-fog2-fill",
      51:"bi-cloud-drizzle-fill", 53:"bi-cloud-drizzle-fill", 55:"bi-cloud-drizzle-fill",
      61:"bi-cloud-rain-fill", 63:"bi-cloud-rain-fill", 65:"bi-cloud-rain-heavy-fill",
      71:"bi-cloud-snow-fill", 73:"bi-cloud-snow-fill", 75:"bi-cloud-snow-fill",
      80:"bi-cloud-rain-fill", 81:"bi-cloud-rain-fill", 82:"bi-cloud-rain-heavy-fill",
      95:"bi-cloud-lightning-rain-fill"
    };

    async function cargarTiempo() {
      try {
        const r = await fetch(
          "https://api.open-meteo.com/v1/forecast?latitude=40.4168&longitude=-3.7038&current=temperature_2m,weather_code,wind_speed_10m&timezone=auto"
        );
        const d = await r.json();
        const c = d.current;

        const temp   = Math.round(c.temperature_2m);
        const code   = c.weather_code;
        const viento = Math.round(c.wind_speed_10m);

        document.getElementById("wTemp").textContent = temp + "°C";
        document.getElementById("wDesc").textContent = WEATHER_CODES[code] ?? "Variable";
        document.getElementById("wMeta").textContent = "Viento " + viento + " km/h";
        document.getElementById("wIcon").className   = "bi " + (WEATHER_ICONS[code] ?? "bi-cloud-fill");

        activarEfecto(code);

      } catch (e) {
        document.getElementById("wDesc").textContent = "No disponible";
        document.getElementById("wMeta").textContent = "";
        document.getElementById("wIcon").className   = "bi bi-cloud-slash-fill";
      }
    }

    cargarTiempo();
    setInterval(cargarTiempo, 10 * 60 * 1000);
  </script>

</body>
</html>
