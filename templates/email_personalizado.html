<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{{ asunto }}</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f6f9; font-family: 'Segoe UI', Arial, sans-serif; color: #333333;">
  <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f4f6f9; padding: 30px 0;">
    <tr>
      <td align="center">
        <table border="0" cellpadding="0" cellspacing="0" width="600" style="background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
          
          <!-- Encabezado estilo Notificación Automática -->
          <tr>
            <td style="background-color: #0d6efd; padding: 25px 30px; color: #ffffff;">
              <h2 style="margin: 0; font-size: 22px;">{{ asunto }}</h2>
              <p style="margin: 5px 0 0 0; font-size: 14px; opacity: 0.9;">Comunicado Interno / Notificación</p>
            </td>
          </tr>

          <!-- Contenido Principal -->
          <tr>
            <td style="padding: 30px;">
              <p style="font-size: 15px; margin-top: 0; color: #212529;">Hola 👋</p>
              <p style="font-size: 15px; color: #555555; line-height: 1.5; margin-bottom: 15px;">
                Has recibido un mensaje enviado desde la plataforma <strong>TurnoApp</strong>:
              </p>

              <!-- Bloque del cuerpo del mensaje con borde destacado -->
              <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f8f9fa; border-radius: 6px; padding: 20px; margin: 20px 0; border-left: 4px solid #0d6efd;">
                <tr>
                  <td style="font-size: 14px; color: #212529; line-height: 1.6; white-space: pre-wrap;">{{ mensaje }}</td>
                </tr>
              </table>

              <!-- Firma / Remitente -->
              <p style="font-size: 14px; color: #6c757d; margin-top: 25px; margin-bottom: 0;">
                Atentamente,<br>
                <strong style="color: #212529;">{{ remitente_nombre }}</strong>
              </p>
            </td>
          </tr>

          <!-- Pie de página -->
          <tr>
            <td align="center" style="background-color: #f1f3f5; padding: 15px; font-size: 12px; color: #6c757d; border-top: 1px solid #e9ecef;">
              Sistema Interno de Gestión de Personal
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
